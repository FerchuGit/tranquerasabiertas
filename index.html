<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornada Tranqueras Abiertas · Finalizada</title>
<meta name="description" content="La Jornada Tranqueras Abiertas en la EEA INTA Cerro Azul finalizó con éxito. ¡Gracias por acompañarnos!">
<meta name="theme-color" content="#0b5cbf">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<meta property="og:site_name" content="INTA Cerro Azul">
<meta property="og:title" content="¡Jornada Tranqueras Abiertas finalizada con éxito!">
<meta property="og:description" content="Gracias a todos los que nos acompañaron el jueves 19 de noviembre en la EEA INTA Cerro Azul. ¡Nos vemos en la próxima!">
<meta property="og:url" content="https://ferchugit.github.io/tranquerasabiertas/">
<meta property="og:image" content="https://ferchugit.github.io/tranquerasabiertas/img/compartir.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Página de cierre: el mapa queda de fondo, difuminado y sin acceso; al frente, el cartel. */
:root{
  color-scheme: light;
  --azul:#0b5cbf;        /* azul institucional del afiche */
  --azul-hondo:#083c85;
  --celeste:#e6f0fc;
  --monte:#1f6b2a;       /* verde del predio */
  --tinta:#12233b;
  --tinta-suave:#55657c;
  --papel:#ffffff;
  --gris-mapa:#d9dbde;
  --linea:#d5dfec;
  --gps:#1a73e8;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --texto:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--azul-hondo);color:var(--tinta);font-family:var(--texto);-webkit-tap-highlight-color:transparent;overflow:hidden}
img{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none}
.fondo{position:fixed;inset:-30px;background:url(img/mapa.jpg) center/cover no-repeat;filter:blur(10px) saturate(.9);transform:scale(1.05)}
.velo{position:fixed;inset:0;background:linear-gradient(180deg,rgba(11,92,191,.62),rgba(8,40,90,.72))}
.fin{position:relative;z-index:2;min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.fin-caja{position:relative;background:var(--papel);border-radius:20px;max-width:380px;width:100%;padding:24px 22px 18px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:finEntra .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes finEntra{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.fin-logo{width:64px;height:64px;padding:6px;border-radius:12px;background:var(--azul);display:block;margin:0 auto 10px}
.fin-eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--azul)}
h1{margin:6px 0 8px;font-family:var(--display);font-weight:800;font-size:31px;line-height:1.02;color:var(--azul-hondo);text-wrap:balance}
.fin-texto{margin:0 auto;max-width:32ch;font-size:15.5px}
.fin-guia{display:block;height:140px;width:auto;margin:14px auto 0}
.firma{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--linea);font-size:11.5px;color:var(--tinta-suave)}
.firma .fa{position:relative;display:inline-flex;padding:4px 6px;border-radius:6px;cursor:default;outline:none}
.firma .fa img{height:20px;width:auto;display:block}
.fa-nombre{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;background:var(--tinta);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.fa-nombre::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--tinta)}
.firma .fa:hover .fa-nombre,.firma .fa:focus .fa-nombre,.firma .fa:active .fa-nombre{opacity:1;transform:translateX(-50%)}
.firma .fa:focus-visible{box-shadow:0 0 0 2px var(--azul)}
.papelitos{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
@media (prefers-reduced-motion:reduce){.fin-caja{animation:none}}
</style>
</head>
<body>
<div class="fondo" aria-hidden="true"></div>
<div class="velo" aria-hidden="true"></div>
<main class="fin">
  <div class="fin-caja">
    <img class="fin-logo" src="img/inta.png" alt="INTA" width="64" height="64">
    <p class="fin-eyebrow">Jornada Tranqueras Abiertas · EEA Cerro Azul</p>
    <h1>¡Jornada finalizada con éxito!</h1>
    <p class="fin-texto">Gracias a todos los que nos acompañaron el jueves 19 de noviembre. ¡Nos vemos en la próxima!</p>
    <img class="fin-guia" src="img/guia.png" alt="" width="150" height="148">
    <div class="firma"><span class="fa" tabindex="0" title="Fernando Alvarenga" aria-label="Fernando Alvarenga"><img src="img/fa.png" alt="" width="31" height="20"><span class="fa-nombre" role="tooltip">Fernando Alvarenga</span></span></div>
  </div>
</main>
<canvas class="papelitos" id="papelitos" aria-hidden="true"></canvas>
<script>
document.addEventListener('contextmenu',function(e){e.preventDefault()});
(function(){
    var tela=document.getElementById('papelitos');
    var ctx=tela.getContext&&tela.getContext('2d'),piezas=[],anim=null,t0=0,DUR=6500;
    var colores=['#0b5cbf','#083c85','#ffffff','#f9c933','#2e7d32','#7cc04a','#c62828','#5ec8e5'];
    if(!ctx||window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    function medir(){
      var r=tela.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
      tela.width=Math.round(r.width*dpr);tela.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);return r;
    }
    var r=medir(),n=Math.round(Math.min(220,r.width*r.height/2600));
    for(var i=0;i<n;i++)piezas.push({
      x:Math.random()*r.width,y:-20-Math.random()*r.height*.9,w:6+Math.random()*7,h:9+Math.random()*9,
      vy:1.6+Math.random()*2.4,vx:-1+Math.random()*2,rot:Math.random()*6.28,vr:-.15+Math.random()*.3,
      osc:Math.random()*6.28,c:colores[i%colores.length],circ:Math.random()<.25
    });
    function cuadro(t){
      if(!t0)t0=t;var pas=t-t0,r=tela.getBoundingClientRect();
      ctx.clearRect(0,0,r.width,r.height);
      var alfa=pas>DUR-1200?Math.max(0,(DUR-pas)/1200):1;
      for(var i=0;i<piezas.length;i++){
        var p=piezas[i];p.osc+=.05;p.x+=p.vx+Math.sin(p.osc)*.8;p.y+=p.vy;p.rot+=p.vr;
        if(p.y>r.height+20&&pas<DUR-2000){p.y=-20;p.x=Math.random()*r.width}
        ctx.save();ctx.globalAlpha=alfa;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
        if(p.c==='#ffffff'){ctx.strokeStyle='rgba(8,60,133,.35)';ctx.lineWidth=1}
        if(p.circ){ctx.beginPath();ctx.arc(0,0,p.w/2,0,6.28);ctx.fill()}
        else{ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.osc)));if(p.c==='#ffffff')ctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.osc)))}
        ctx.restore();
      }
      if(pas<DUR)anim=requestAnimationFrame(cuadro);else parar();
    }
    function parar(){if(anim){cancelAnimationFrame(anim);anim=null}if(ctx){var r=tela.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height)}}
    window.addEventListener('resize',function(){if(anim)medir()});
    anim=requestAnimationFrame(cuadro);
})();
</script>
</body>
</html>
