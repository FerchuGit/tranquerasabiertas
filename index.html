<style>
/* Layout: cabecera azul con logo, mapa a pantalla completa, panel inferior con ficha y tira de postas (lateral en pantallas anchas). */
:root{
  color-scheme: light;
  --azul:#0b5cbf;        /* azul institucional del afiche */
  --azul-hondo:#083c85;
  --celeste:#e6f0fc;
  --monte:#1f6b2a;       /* verde del predio */
  --tinta:#12233b;
  --tinta-suave:#55657c;
  --papel:#ffffff;
  --gris-mapa:#d9dbde;
  --linea:#d5dfec;
  --gps:#1a73e8;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --texto:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
[hidden]{display:none!important}
/* Disuade guardar las imágenes: sin menú de pulsación larga ni arrastre */
img{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
body{-webkit-touch-callout:none}

.app{height:100%;display:flex;flex-direction:column;position:relative}

/* Cabecera */
.cab{background:linear-gradient(180deg,var(--azul),var(--azul-hondo));color:#fff;padding:9px 16px 10px;display:flex;align-items:center;gap:12px}
.cab .txt{flex:1;min-width:0}
.cab .fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cab .eyebrow{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:12px;background:rgba(255,255,255,.18);padding:1px 9px 2px;border-radius:5px}
.cab .fecha{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.05;white-space:nowrap}
.cab h1{margin:4px 0 0;font-family:var(--display);font-weight:800;font-size:29px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.cab .lugar{margin:4px 0 0;font-size:13.5px;font-weight:500;opacity:.95}
.cab .logo{width:58px;height:58px;flex:none}

/* Mapa */
.cuerpo{flex:1;min-height:0;display:flex;flex-direction:column}
.mapa{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--gris-mapa);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapa.arrastra{cursor:grabbing}
.lienzo{position:absolute;left:0;top:0;width:2400px;height:1697px;transform-origin:0 0;will-change:transform}
.lienzo.vuela, .lienzo.vuela .pin, .lienzo.vuela .rotulo, .lienzo.vuela .yo{transition:transform .65s cubic-bezier(.22,.8,.25,1)}
.lienzo img.base, .lienzo img.detalle{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none}
.lienzo img.base{left:0;top:0;width:100%;height:100%}
.lienzo img.detalle{left:1181.5px;top:376.3px;width:732.1px;height:564.4px;opacity:0;transition:opacity .5s}
.lienzo img.detalle.lista{opacity:1}

.pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;transform:scale(var(--m,1));
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.pin img{width:100%;height:100%;display:block;border-radius:50%;pointer-events:none}
.pin .num{position:absolute;right:-5px;top:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--tinta);color:#fff;border:1.5px solid #fff;
  font-family:var(--display);font-weight:800;font-size:14px;line-height:16px;text-align:center}
.pin::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--azul);opacity:0;pointer-events:none}
.pin.activo{z-index:3}
.pin.activo .num{background:var(--azul)}
.pin.activo::after{animation:onda 1.6s ease-out infinite}
@keyframes onda{0%{transform:scale(1);opacity:.95}100%{transform:scale(2.1);opacity:0}}

.rotulo{position:absolute;left:1508px;top:756px;transform-origin:0 50%;transform:translateY(-50%) scale(var(--m,1));pointer-events:none;
  background:rgba(255,255,255,.92);color:var(--tinta);font-family:var(--display);font-weight:700;font-size:13px;line-height:1;padding:3px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* Mi ubicación */
.yo{position:absolute;width:0;height:0;z-index:4;pointer-events:none;transform:scale(var(--m,1))}
.yo .punto{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--gps);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.yo .punto::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--gps);opacity:.35;animation:late 2s ease-out infinite}
@keyframes late{0%{transform:scale(1);opacity:.4}100%{transform:scale(3);opacity:0}}
.precision{position:absolute;border-radius:50%;background:rgba(26,115,232,.14);border:1px solid rgba(26,115,232,.45);pointer-events:none;z-index:2}

/* Controles */
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:44px;height:44px;border-radius:10px;background:var(--papel);box-shadow:0 2px 8px rgba(18,35,59,.28);font-size:24px;font-weight:600;color:var(--azul-hondo);display:grid;place-items:center}
.zoom button:active{background:var(--celeste)}
.zoom svg{width:22px;height:22px}
.zoom #gps{margin-top:8px}
.zoom #gps[aria-pressed="true"]{background:var(--gps);color:#fff}
.aviso{position:absolute;left:12px;right:68px;top:12px;z-index:5;background:var(--tinta);color:#fff;font-size:14px;padding:9px 12px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.3);max-width:420px}

.info{position:absolute;left:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:calc(100% - 24px)}
.info button{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 12px 0 9px;border-radius:999px;background:var(--papel);color:var(--azul-hondo);font-size:13.5px;font-weight:600;box-shadow:0 2px 8px rgba(18,35,59,.28)}
.info button svg{width:18px;height:18px}
.info-caja{position:relative;background:var(--papel);border-radius:12px;padding:10px 46px 12px 14px;font-size:13.5px;box-shadow:0 2px 12px rgba(18,35,59,.3);max-width:330px}
.info-caja p{margin:0}
.info .info-x{position:absolute;right:4px;top:4px;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:var(--celeste);box-shadow:none;display:grid;place-items:center;color:var(--azul-hondo)}
.info .info-x svg{width:18px;height:18px}
.info-caja .credito{margin-top:9px;padding-top:9px;border-top:1px solid var(--linea);color:var(--tinta-suave);display:flex;align-items:center;gap:12px;font-size:12.5px;line-height:1.3}
.info-caja .credito img{width:96px;height:auto;flex:none}
/* Firma discreta del autor, abajo a la derecha del mapa */
.firma{position:absolute;right:12px;bottom:14px;z-index:5;display:block;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.72);box-shadow:0 1px 4px rgba(18,35,59,.18);opacity:.8;transition:opacity .2s}
.firma:hover,.firma:focus-visible{opacity:1}
.firma img{display:block;height:20px;width:auto}

/* Hoja de información de la posta */
.hoja{position:absolute;inset:0;z-index:20;background:rgba(18,35,59,.5);display:flex;align-items:flex-end;justify-content:center}
.hoja-caja{position:relative;background:var(--papel);width:100%;max-width:560px;max-height:82%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.3);animation:sube .28s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.hoja-x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;background:var(--celeste);color:var(--azul-hondo);display:grid;place-items:center;z-index:1}
.hoja-x svg{width:20px;height:20px}
.hoja-cuerpo{overflow-y:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.hoja-cab{display:flex;align-items:center;gap:12px;padding-right:48px}
.hoja-cab .icono{display:flex;flex:none}
.hoja-cab .icono img{height:74px;width:auto;display:block}
.hoja-cab .icono img + img{margin-left:-14px}
.hoja-cab .sobre{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--azul)}
.hoja-cab h2{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:27px;line-height:1.02;text-wrap:balance}
.hoja-cuerpo .intro{margin:12px 0 0;font-size:16px;max-width:65ch}
.hoja-cuerpo dl{margin:14px 0 0;display:flex;flex-direction:column;gap:10px}
.hoja-cuerpo dt{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;color:var(--monte);padding-left:10px;border-left:4px solid var(--monte)}
.hoja-cuerpo dd{margin:3px 0 0 14px;font-size:15px;color:var(--tinta);max-width:62ch}
.hoja-cuerpo .video{display:flex;align-items:center;gap:10px;margin:16px 0 0;padding:10px 14px;min-height:48px;border-radius:12px;background:#fdecec;color:#a3161b;font-weight:600;text-decoration:none;width:fit-content}
.hoja-cuerpo .video svg{width:28px;height:28px;color:#e02424;flex:none}
.hoja-cuerpo .orienta{margin:18px 0 0;font-size:12.5px;color:var(--tinta-suave);max-width:62ch}
.hoja-nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--linea)}
.hoja-nav button{min-height:44px;padding:0 16px;border-radius:999px;background:var(--celeste);color:var(--azul-hondo);font-weight:600;font-size:15px}
.hoja-nav button:active{background:#cfe1f8}
.ficha .vermas{display:inline-block;margin:1px 0 3px;color:var(--azul);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:2px;text-align:left}
@media (min-width:860px){ .hoja{align-items:center} .hoja-caja{border-radius:18px} }
@media (prefers-reduced-motion:reduce){ .hoja-caja{animation:none} }

/* Panel */
.panel{background:var(--papel);border-top:1px solid var(--linea);box-shadow:0 -6px 18px rgba(18,35,59,.12);z-index:6;padding-bottom:env(safe-area-inset-bottom,0)}
.ficha{display:flex;align-items:center;gap:12px;padding:10px 16px 8px;min-height:96px}
.ficha .icono{flex:none;display:flex;align-items:flex-end;gap:2px}
.ficha .icono img{height:78px;width:auto;display:block}
.ficha .icono img + img{margin-left:-14px}
.ficha .icono img.guia{height:84px;margin-bottom:-8px}
.ficha .datos{flex:1;min-width:0}
.ficha .sobre{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--azul)}
.ficha h2{margin:1px 0 2px;font-family:var(--display);font-weight:700;font-size:23px;line-height:1.04;text-wrap:balance;overflow-wrap:anywhere}
.ficha .temas{margin:0 0 2px;font-size:14px;font-weight:500}
.ficha .nota{margin:0;font-size:13.5px;color:var(--tinta-suave)}
.ficha .nota button{color:var(--azul);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.ficha .dist{color:var(--gps);font-weight:600}
.pasos{display:flex;flex-direction:column;gap:6px;flex:none}
.pasos button{width:44px;height:44px;border-radius:50%;background:var(--celeste);color:var(--azul-hondo);display:grid;place-items:center}
.pasos button:active{background:#cfe1f8}
.pasos svg{width:20px;height:20px}

.tira{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scroll-padding:0 16px;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:4px 13px 4px 4px;border-radius:999px;border:1.5px solid var(--linea);background:var(--papel);font-weight:600;font-size:14.5px;white-space:nowrap;min-height:44px}
.chip img{width:34px;height:34px;border-radius:50%;flex:none}
.chip b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1}
.chip[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}

@media (min-width:860px){
  .cab{padding:14px 24px}
  .cab h1{font-size:40px}
  .cab .logo{width:74px;height:74px}
  .cuerpo{flex-direction:row-reverse}
  .panel{width:360px;flex:none;border-top:0;border-right:1px solid var(--linea);box-shadow:6px 0 18px rgba(18,35,59,.1);display:flex;flex-direction:column;min-height:0}
  .ficha{padding:18px 20px 14px;border-bottom:1px solid var(--linea);min-height:130px}
  .tira{flex-direction:column;overflow:auto;padding:14px 20px 20px;flex:1}
  .chip{border-radius:14px;white-space:normal}
}
@media (max-width:360px){ .cab h1{font-size:25px} .ficha h2{font-size:21px} .ficha .icono img{height:66px} }
@media (prefers-reduced-motion:reduce){
  .lienzo.vuela, .lienzo.vuela .pin, .lienzo.vuela .rotulo, .lienzo.vuela .yo{transition:none}
  .pin.activo::after{animation:none;opacity:.85;transform:scale(1.2)}
  .yo .punto::after{animation:none}
}
</style>
</head>
<body>

    </div>
  </div>

<script>
/* ---------- Georreferencia del croquis (para "Mi ubicación") ----------
   Completar UNA de las dos formas y el botón de ubicación aparece solo:
   a) Extensión de la imagen completa (si el croquis respeta una exportación georreferenciada, norte arriba):
        window.MAPA_GEO = { extent: { oeste:-55.xxxx, sur:-27.xxxx, este:-55.xxxx, norte:-27.xxxx } };
   b) Tres o más puntos de control (lat, lon reales; x, y en píxeles de img/mapa.jpg, 2400 x 1697):
        window.MAPA_GEO = { puntos: [ {lat:-27.x, lon:-55.x, x:0, y:0}, ... ] };
*/
// Ajuste hecho con los 18 vértices del perímetro (puntos_perimetroEEA.kml)
window.MAPA_GEO = window.MAPA_GEO || { puntos: [{"lat": -27.6452418, "lon": -55.4651608, "x": 0, "y": 0}, {"lat": -27.6446494, "lon": -55.421059, "x": 2400, "y": 0}, {"lat": -27.6723587, "lon": -55.4634796, "x": 0, "y": 1697}] };
</script>

    ty = mh<=s.h ? (s.h-mh)/2 : Math.min(0,Math.max(s.h-mh,ty));

  // ---------- Mi ubicación (GPS) ----------
  var geo=null,yo=null,halo=null,pos=null,vigia=null,primera=true;
  function resolver3(A,b){ // Cramer 3x3
    function det(m){return m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])-m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])+m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0])}
    var D=det(A);if(Math.abs(D)<1e-18)return null;
    return [0,1,2].map(function(c){var M=A.map(function(r,i){var q=r.slice();q[c]=b[i];return q});return det(M)/D});
  }
  function armarGeo(cfg){
    if(!cfg)return null;
    var pts=cfg.puntos;
    if(cfg.extent){var e=cfg.extent;pts=[{lat:e.norte,lon:e.oeste,x:0,y:0},{lat:e.norte,lon:e.este,x:W,y:0},{lat:e.sur,lon:e.oeste,x:0,y:H},{lat:e.sur,lon:e.este,x:W,y:H}]}
    if(!pts||pts.length<3)return null;
    var la0=0,lo0=0;pts.forEach(function(p){la0+=p.lat/pts.length;lo0+=p.lon/pts.length});
    var kx=111320*Math.cos(la0*Math.PI/180),ky=110574; // metros por grado
    var A=[[0,0,0],[0,0,0],[0,0,0]],bx=[0,0,0],by=[0,0,0];
    pts.forEach(function(p){
      var v=[(p.lon-lo0)*kx,(p.lat-la0)*ky,1];
      for(var i=0;i<3;i++){for(var j=0;j<3;j++)A[i][j]+=v[i]*v[j];bx[i]+=v[i]*p.x;by[i]+=v[i]*p.y}
    });
    var cx=resolver3(A,bx),cy=resolver3(A,by);if(!cx||!cy)return null;
    return {
      aPx:function(lat,lon){var e=(lon-lo0)*kx,n=(lat-la0)*ky;return {x:cx[0]*e+cx[1]*n+cx[2],y:cy[0]*e+cy[1]*n+cy[2]}},
      pxPorMetro:(Math.hypot(cx[0],cy[0])+Math.hypot(cx[1],cy[1]))/2
    };
  }
  function pintarDistancia(){

    var m=Math.hypot(pos.x-activo.x,pos.y-activo.y)/geo.pxPorMetro;
    d.textContent=m<15?'Estás acá.':'Estás a unos '+(m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1).replace('.',',')+' km')+'.';
  }
  function alUbicar(g){

    if(!dentro){

  // ---------- Arrastre, pellizco, rueda y doble toque ----------
  var dedos={},movido=false,ini=null,ultimoToque=0;
  function lista(){return Object.keys(dedos).map(function(i){return dedos[i]})}

      ini={dist:Math.hypot(d[0].x-d[1].x,d[0].y-d[1].y),k:k,tx:tx,ty:ty,cx:(d[0].x+d[1].x)/2-s.l,cy:(d[0].y+d[1].y)/2-s.t};
    }
  }
  window.addEventListener('pointermove',function(e){
    if(!dedos[e.pointerId])return;

      var dist=Math.hypot(d[0].x-d[1].x,d[0].y-d[1].y),cx=(d[0].x+d[1].x)/2-s.l,cy=(d[0].y+d[1].y)/2-s.t;
      var nk=Math.max(kMin,Math.min(kMax,ini.k*dist/ini.dist));

  function soltar(e){
    if(!dedos[e.pointerId])return;
    delete dedos[e.pointerId];mapa.classList.remove('arrastra');

    if(!movido&&e.type==='pointerup'&&!e.target.closest('.pin')){
      var t=Date.now(),s=tam();
      if(t-ultimoToque<320){zoomEn(e.clientX-s.l,e.clientY-s.t,1.8,true);ultimoToque=0}else ultimoToque=t;

  mapa.addEventListener('wheel',function(e){
    e.preventDefault();var s=tam();lienzo.classList.remove('vuela');
    zoomEn(e.clientX-s.l,e.clientY-s.t,Math.exp(-e.deltaY*0.0016),false);
  },{passive:false});

  var infoBtn=document.getElementById('infoBtn'),infoCaja=document.getElementById('infoCaja');
  var firma=document.getElementById('firma');
  function alternarInfo(abrir){
    var abre=abrir!=null?abrir:infoCaja.hidden;infoCaja.hidden=!abre;
    infoBtn.setAttribute('aria-expanded',abre?'true':'false');firma.setAttribute('aria-expanded',abre?'true':'false');
  }
  infoBtn.addEventListener('click',function(){alternarInfo()});
  firma.addEventListener('click',function(){alternarInfo()});
  document.getElementById('infoCerrar').addEventListener('click',function(){alternarInfo(false);infoBtn.focus()});

  function centro(f){var s=tam();zoomEn(s.w/2,s.h/2,f,true)}
  document.getElementById('mas').addEventListener('click',function(){centro(1.5)});
  document.getElementById('menos').addEventListener('click',function(){centro(1/1.5)});
  document.getElementById('todo').addEventListener('click',function(){elegir(null);k=kMin;tx=0;ty=0;pintar(true)});

  // Estado inicial: la zona de actividades encuadrada
  mostrarFicha(null);
  function inicio(){ encuadrar(puntos,60,1.6); lienzo.classList.remove('vuela'); }
  inicio();
  var antes=tam();
  window.addEventListener('resize',function(){
    var s=tam();
    if(Math.abs(s.w-antes.w)>40||Math.abs(s.h-antes.h)>120){ if(activo) volar(activo.x,activo.y,k); else inicio(); }
    else pintar(false);
    antes=s;
  });
})();
</script>
</body>
</html>
